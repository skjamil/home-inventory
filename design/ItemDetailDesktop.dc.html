<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#FAFAF9; --surface:#FFFFFF; --border:#E5E5E3; --text:#1A1A19; --text-2:#6B6B68;
      --accent:#0F766E; --accent-ink:#FFFFFF; --warn-bg:#FEF3C7; --warn-text:#B45309;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
        --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
      }
    }
    :root[data-theme="dark"]{
      --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
      --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
    .h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.01em;margin:0;}
    .h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin:0;}
    .muted{color:var(--text-2);font-size:12px;}
    .row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border);font-size:13px;}
    .row span:first-child{color:var(--text-2);}
    .row span:last-child{font-weight:600;}
    .thumb{width:100%;aspect-ratio:1;border-radius:10px;background:var(--border);}
    .att{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);}
    .btn-ghost{height:40px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;gap:6px;}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
</helmet>
<div style="min-height:100%;background:var(--bg);">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
      <span class="h2">Item</span>
    </div>
    <div style="display:flex;gap:16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warn-text)" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path></svg>
    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:28px 20px;">
    <div style="margin-bottom:18px;">
      <h1 class="h1">Sony A7 IV Camera</h1>
      <span class="muted">Electronics</span>
    </div>

    <div style="display:flex;gap:28px;align-items:flex-start;">
      <div style="width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;">
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;">
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <span style="font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;">Documents</span>
          <div class="att">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
            <span style="font-size:12px;font-weight:600;">Receipt.pdf</span>
          </div>
          <div class="att">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
            <span style="font-size:12px;font-weight:600;">Warranty-card.jpg</span>
          </div>
        </div>
      </div>

      <div style="flex:1;min-width:0;">
        <div class="row" style="border-top:none;"><span>Purchase date</span><span>Sep 12, 2024</span></div>
        <div class="row"><span>Price</span><span>$2,499.00</span></div>
        <div class="row"><span>Warranty expiration</span><span style="color:var(--warn-text);">Sep 12, 2026</span></div>
        <div class="row"><span>Serial number</span><span>SNY-A7IV-88213</span></div>
        <div class="row"><span>Location</span><span>Office shelf</span></div>
        <button class="btn-ghost" style="margin-top:20px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>
          Edit item
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
