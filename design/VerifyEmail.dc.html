<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#FAFAF9; --surface:#FFFFFF; --border:#E5E5E3; --text:#1A1A19; --text-2:#6B6B68;
      --accent:#0F766E; --accent-ink:#FFFFFF; --warn-bg:#FEF3C7; --warn-text:#B45309;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
        --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
      }
    }
    :root[data-theme="dark"]{
      --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
      --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--text);}
    .btn-primary{height:44px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;width:100%;}
    .h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.01em;margin:0;}
    .h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin:0;}
    .muted{color:var(--text-2);font-size:13px;line-height:1.6;}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
</helmet>
<div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg);">
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:28px 20px 4px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M8 12h8M12 8v8"></path></svg>
    <span class="h2">Home Inventory</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 28px 60px;text-align:center;gap:16px;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.25"><path d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h1 class="h1">Email verified</h1>
    <p class="muted">Your account is ready. You can log in now with the password you created.</p>
    <button class="btn-primary" style="margin-top:8px;">Continue to log in</button>
  </div>

  <div style="border-top:1px solid var(--border);padding:16px 24px 24px;display:flex;flex-direction:column;gap:6px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-2);text-transform:uppercase;">If the link is invalid or expired</span>
    <p class="muted" style="margin:0;">This state shows instead: an explanation, plus a button to resend the verification email to the address just registered.</p>
  </div>
</div>
</x-dc>
</body>
</html>
