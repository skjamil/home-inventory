<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#FAFAF9; --surface:#FFFFFF; --border:#E5E5E3; --text:#1A1A19; --text-2:#6B6B68;
      --accent:#0F766E; --accent-ink:#FFFFFF; --warn-bg:#FEF3C7; --warn-text:#B45309;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
        --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
      }
    }
    :root[data-theme="dark"]{
      --bg:#111113; --surface:#1B1B1F; --border:#2A2A2E; --text:#F2F2F0; --text-2:#9A9A97;
      --accent:#2DD4BF; --accent-ink:#08312D; --warn-bg:#3F2E0A; --warn-text:#FBBF24;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--text);}
    .btn-primary{height:44px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;width:100%;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .field span{font-size:12px;font-weight:600;color:var(--text-2);}
    .field input{height:44px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
    .field input::placeholder{color:var(--text-2);}
    .h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.01em;margin:0;}
    .h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin:0;}
    .muted{color:var(--text-2);font-size:13px;line-height:1.5;}
    .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
</helmet>
<div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg);">
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:28px 20px 4px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M8 12h8M12 8v8"></path></svg>
    <span class="h2">Home Inventory</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 24px 40px;">
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:22px;">
      <h1 class="h1">Create your account</h1>
      <p class="muted">Track everything you own. Your inventory stays private to you.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <label class="field">
        <span>Email</span>
        <input type="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" placeholder="At least 10 characters">
      </label>
      <label class="field">
        <span>Confirm password</span>
        <input type="password" placeholder="Re-enter your password">
      </label>

      <button class="btn-primary" style="margin-top:6px;">Create account</button>
      <div class="tag" style="justify-content:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        Registration attempts are rate limited
      </div>
    </div>

    <p class="muted" style="text-align:center;margin-top:24px;">
      Already have an account? <a href="#">Log in</a>
    </p>
  </div>
</div>
</x-dc>
</body>
</html>
